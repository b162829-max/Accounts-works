

name: Build Driver Accounts APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract ZIP and Find Gradle
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_COUNT=$(find . -maxdepth 1 -type f -iname "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -gt 1 ]; then
            echo "ERROR: More than one ZIP file found."
            exit 1
          fi

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            unzip -q "$ZIP_FILE" -d extracted
          fi

          GRADLE_FILE=$(find . -type f -name gradlew \
            -not -path './.git/*' | head -n 1)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: Gradle Wrapper not found."
            find . -maxdepth 6 -type f
            exit 1
          fi

          echo "GRADLE_DIR=$(dirname "$GRADLE_FILE")" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$GRADLE_DIR"
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Driver-Accounts-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
